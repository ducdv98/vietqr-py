name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy packages/vietqr-core/src packages/vietqr-api/src

      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vietqr-web
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"

      - name: Install Python dependencies (for the OpenAPI drift check)
        working-directory: .
        run: uv sync --locked

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/vietqr-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: OpenAPI client drift
        run: pnpm api:check

      - name: Locale key parity
        run: pnpm i18n:check

  web-e2e:
    runs-on: ubuntu-latest
    needs: web
    env:
      E2E_API_URL: http://127.0.0.1:8080
    defaults:
      run:
        working-directory: packages/vietqr-web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image (layer cache in GitHub Actions cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: vietqr-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Start API container
        run: |
          docker run -d --name vietqr-api -p 8080:8080 vietqr-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          docker logs vietqr-api
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/vietqr-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (incl. axe) against the API container
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: packages/vietqr-web/test-results

      - name: API container logs on failure
        if: failure()
        run: docker logs vietqr-api

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build web image (not published)
        uses: docker/build-push-action@v7
        with:
          context: packages/vietqr-web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

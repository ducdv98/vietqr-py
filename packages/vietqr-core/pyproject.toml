[project]
name = "vietqr-core"
version = "0.1.0"
description = "VietQR (NAPAS247 / EMVCo) payload builder, parser, QR renderer and image decoder."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pillow>=13.0.0",
    "segno>=1.6.6",
    "zxing-cpp>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

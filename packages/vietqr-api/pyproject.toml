[project]
name = "vietqr-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
    "vietqr-core",
]

[project.scripts]
vietqr-api = "vietqr_api.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
vietqr-core = { workspace = true }
